<!doctype html>
<!-- Sorgente dell'immagine di anteprima (docs/og.png, 1200x630): aprirla e fare uno screenshot di 1200x630. -->
<html lang="it"><head><meta charset="utf-8"><title>og</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #12263f 0%, #1d4468 100%); color: #fff; display: flex; padding: 64px 70px; gap: 56px; }
  .sx { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: 84px; line-height: 1.02; letter-spacing: -1px; }
  p { font-size: 34px; line-height: 1.3; color: #dbe5ef; margin-top: 22px; }
  .etichette { display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; }
  .etichette span { font-size: 22px; font-weight: 700; color: #8fe0df; border: 2px solid #3a6a8a; border-radius: 999px; padding: 6px 18px; }
  .dx { width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .carta { background: #fff; color: #1b2430; border-radius: 22px; padding: 30px 32px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .carta small { display: block; font-size: 17px; font-weight: 800; letter-spacing: 1px; color: #546070; margin-bottom: 12px; }
  .testo { font-size: 28px; line-height: 1.7; }
  mark { padding: 1px 8px; border-radius: 6px; border-bottom: 4px solid; font-weight: 700; background: transparent; color: inherit; }
  .ok { background: #dcf3e5; border-color: #2a9a5f; } .ko { background: #fde0e0; border-color: #d34444; }
  .fonte { margin-top: 18px; background: #e3effa; color: #0f4c81; border: 2px dashed #3b86c9; border-radius: 12px; padding: 10px 16px; font-size: 24px; font-weight: 700; }
  .conta { display: flex; gap: 12px; margin-top: 22px; }
  .conta div { flex: 1; text-align: center; border-radius: 12px; padding: 8px 0; font-size: 19px; font-weight: 700; border: 2px solid; }
  .conta b { display: block; font-size: 34px; }
  .c1 { background: #dcf3e5; color: #14603a; border-color: #2a9a5f; } .c2 { background: #fff0c2; color: #6a4d00; border-color: #cf9800; } .c3 { background: #fde0e0; color: #8c1c1c; border-color: #d34444; }
</style></head><body>
<div class="sx"><h1>Controllo Fonti</h1><p>L'AI ha sbagliato i dettagli? Mettila alla prova con il documento originale.</p>
<div class="etichette"><span>Tutto nel browser</span><span>Esercizi per la formazione</span><span>Codice aperto</span></div></div>
<div class="dx"><div class="carta"><small>TESTO DELL'AI</small>
<div class="testo">Il fatturato è di <mark class="ok">2,4 milioni</mark>, in crescita del <mark class="ko">12%</mark> rispetto al <mark class="ok">2025</mark>.</div>
<div class="fonte">Nella fonte: «8%»</div>
<div class="conta"><div class="c1"><b>6</b>verificati</div><div class="c2"><b>1</b>da controllare</div><div class="c3"><b>3</b>non trovati</div></div></div></div>
</body></html>
